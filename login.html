<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ToDo App</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <section id="auth-section">
    <div id="login-box">
      <h2>Login</h2>
      <input id="login-username" type="text" placeholder="Email" />
      <input id="login-password" type="password" placeholder="Password" />
      <button id="login-btn">Login</button>
      <p>Don’t have an account? <a id="switch-to-signup">Sign Up</a></p>
    </div>

    <div id="signup-box" style="display:none;">
      <h2>Sign Up</h2>
      
      <input id="signup-email" type="text" placeholder="Email" />
      <input id="signup-password" type="password" placeholder="Password" />
      <button id="signup-btn">Create Account</button>
      <p>Already have an account? <a id="switch-to-login">Login</a></p>
    </div>
  </section>
</body>
</html>
